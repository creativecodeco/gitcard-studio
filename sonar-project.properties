# SonarQube / SonarCloud project configuration
sonar.projectKey=creativecodeco_gitcard-studio
sonar.projectName=GitCard Studio
sonar.projectVersion=1.8.0
sonar.organization=creativecodeco

# Source and Test directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/*.spec.ts,**/*.test.ts

# Language and Encoding
sonar.sourceEncoding=UTF-8

# Test Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
