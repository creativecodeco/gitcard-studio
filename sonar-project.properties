# SonarQube / SonarCloud project configuration
sonar.projectKey=creativecodeco_gitcard-studio
sonar.projectName=GitCard Studio
sonar.projectVersion=1.18.0
sonar.organization=creativecodeco

# Source and Test directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/.agents/**,**/design-system/**,**/coverage/**,**/.scannerwork/**,**/*.spec.ts,**/*.test.ts,frontend/src/utils/i18n/locales/**,backend/src/infrastructure/i18n/**,frontend/src/styles/**,frontend/src/pages/help/**,frontend/src/pages/admin/**,frontend/src/pages/privacy.astro,frontend/src/pages/terms.astro

# Language and Encoding
sonar.sourceEncoding=UTF-8

# Test Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
